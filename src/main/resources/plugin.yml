name: ${project.name}
version: ${project.version}
main: dev.pupwired.mathesis.core.MathesisPlugin
api-version: '26.3'
description: The core plugin and API for the Mathesis RPG stats and mechanics suite.

depend:
  - LuckyLib

commands:
  mathesis:
    description: Mathesis admin command
    usage: /mathesis <reload|dev>
    permission: mathesis.admin
  attributes:
    description: View and spend attribute points
    usage: /attributes [show|spend]
    aliases: [attr]
    permission: mathesis.attributes

permissions:
  mathesis.admin:
    description: Mathesis admin permission
    default: op
  mathesis.attributes:
    description: Use /attributes
    default: true
